[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "VCD43NRT"
version = "1.4.0"
description = "VIIRS near-real-time BRDF, albedo, and NDVI processing across SNPP and JPSS missions"
readme = "README.md"
authors = [
    { name = "Gregory H. Halverson", email = "gregory.h.halverson@jpl.nasa.gov" },
    { name = "Margaret C. Johnson", email = "maggie.johnson@jpl.nasa.gov" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "colored-logging>=1.1.0",
    "earthaccess>=0.9.0",
    "setuptools<81",
    "GEOS5FP>=2.23.0",
    "h5py>=3.14.0",
    "matplotlib>=3.10.9",
    "modland>=1.1.2",
    "numpy>=2,<2.6",
    "pandas>=3.1.1",
    "python-dateutil>=2.9.0",
    "pytictoc>=1.5.3",
    "rasters>=1.20.0",
    "requests>=2.32",
    "scikit-image>=0.26.0",
    "shapely>=2.2.0",
    "sun-angles>=1.7.0",
    "xmltodict>=1.0.4",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "build",
    "pytest>=6.0",
    "pytest-cov",
    "jupyter",
    "twine",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "."
module-name = "VCD43NRT._brdf_rust"
features = ["pyo3/extension-module"]
include = ["VCD43NRT/*.txt"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project.urls]
Homepage = "https://github.com/JPL-Evapotranspiration-Algorithms/VCD43NRT"

[project.scripts]
VCD43NRT = "VCD43NRT.VCD43NRT:main"
VNP09GA = "VCD43NRT.VNP09GA:main"
VJ109GA = "VCD43NRT.VJ109GA:main"
VJ209GA = "VCD43NRT.VJ209GA:main"