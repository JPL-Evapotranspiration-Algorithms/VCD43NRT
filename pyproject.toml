[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "VCD43NRT"
version = "0.1.0"
description = "VIIRS near-real-time BRDF, albedo, and NDVI processing across SNPP and JPSS missions"
readme = "README.md"
authors = [
    { name = "Gregory H. Halverson", email = "gregory.h.halverson@jpl.nasa.gov" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]
dependencies = [
    "beautifulsoup4",
    "colored-logging~=1.1.0",
    "earthaccess",
    "GEOS5FP~=2.21.0",
    "h5py",
    "matplotlib",
    "modland",
    "numpy",
    "pandas",
    "python-dateutil",
    "pytictoc",
    "rasters",
    "requests",
    "scikit-image",
    "shapely",
    "sun-angles",
    "xmltodict",
]
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "build",
    "pytest>=6.0",
    "pytest-cov",
    "jupyter",
    "twine",
]

[tool.maturin]
manifest-path = "rust/Cargo.toml"
python-source = "."
module-name = "VCD43NRT._brdf_rust"
features = ["pyo3/extension-module"]
include = ["VCD43NRT/*.txt"]

[project.urls]
Homepage = "https://github.com/"

[project.scripts]
VCD43NRT = "VCD43NRT.VCD43NRT:main"
VNP09GA = "VCD43NRT.VNP09GA:main"
VJ109GA = "VCD43NRT.VJ109GA:main"
VJ209GA = "VCD43NRT.VJ209GA:main"