name: Rust wheels

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter python3.11
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Build source distribution
        run: |
          python -m pip install maturin
          maturin sdist --manifest-path rust/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  test-source:
    name: Test source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install source package and test dependencies
        run: python -m pip install -e . pytest
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check
      - name: Test Rust solver
        run: cargo test --manifest-path rust/Cargo.toml
      - name: Lint Rust solver
        run: cargo clippy --manifest-path rust/Cargo.toml --all-targets -- -D warnings
      - name: Test Python package
        run: python -m pytest -q

  test-wheels:
    name: Test wheel on ${{ matrix.target }} / Python ${{ matrix.python-version }}
    needs: build-wheels
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install published-style wheel
        shell: bash
        run: |
          python -m pip install "$(find dist -name '*.whl' -print -quit)"
      - name: Smoke-test Rust extension without a source build
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          python -I -m VCD43NRT.smoke_test

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: [build-wheels, build-sdist, test-source, test-wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
